<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>RESTAPI Test</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>RESTAPI Test</h2>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">
      ➕ เพิ่มสินค้า
    </button>
  </div>

  <div class="card shadow">
    <div class="card-body">
      <table class="table table-bordered table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>ชื่อสินค้า</th>
            <th>ราคา</th>
            <th width="180">จัดการ</th>
          </tr>
        </thead>
        <tbody id="productTable">
          <tr>
            <td colspan="4" class="text-center">กำลังโหลด...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal เพิ่ม -->
<div class="modal fade" id="addModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">เพิ่มสินค้า</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="addName" class="form-control mb-2" placeholder="ชื่อสินค้า">
        <input type="number" id="addPrice" class="form-control" placeholder="ราคา">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
        <button class="btn btn-success" onclick="addProduct()">บันทึก</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal แก้ไข -->
<div class="modal fade" id="editModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">แก้ไขสินค้า</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <input type="text" id="editName" class="form-control mb-2">
        <input type="number" id="editPrice" class="form-control">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
        <button class="btn btn-primary" onclick="updateProduct()">อัปเดต</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="liveToast" class="toast align-items-center text-bg-success border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg">
        สำเร็จ
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const apiURL = "api/products.php";

function showToast(message, success = true) {
  const toastEl = document.getElementById('liveToast');
  toastEl.className = `toast align-items-center text-bg-${success ? 'success' : 'danger'} border-0`;
  document.getElementById("toastMsg").innerText = message;
  new bootstrap.Toast(toastEl).show();
}

// ✅ โหลดสินค้า
async function loadProducts() {
  const table = document.getElementById("productTable");
  table.innerHTML = `<tr><td colspan="4" class="text-center">กำลังโหลด...</td></tr>`;

  try {
    const res = await fetch(apiURL);
    const data = await res.json();

    table.innerHTML = "";

    if (!data.length) {
      table.innerHTML = `<tr><td colspan="4" class="text-center">ไม่มีข้อมูล</td></tr>`;
      return;
    }

    data.forEach(p => {
      const safeName = p.product_name.replace(/'/g, "\\'"); // ✅ กัน quote พัง

      table.innerHTML += `
        <tr>
          <td>${p.id}</td>
          <td>${p.product_name}</td>
          <td>${p.price} บาท</td>
          <td>
            <button class="btn btn-sm btn-warning"
              onclick="openEdit(${p.id}, '${safeName}', ${p.price})">✏️</button>
            <button class="btn btn-sm btn-danger"
              onclick="deleteProduct(${p.id})">🗑️</button>
          </td>
        </tr>
      `;
    });

  } catch (err) {
    console.error("โหลดไม่ได้:", err);
    table.innerHTML = `<tr><td colspan="4" class="text-danger text-center">โหลดข้อมูลไม่สำเร็จ</td></tr>`;
  }
}

// ✅ เพิ่มสินค้า
async function addProduct() {
  const name = document.getElementById("addName").value.trim();
  const price = document.getElementById("addPrice").value;

  if (!name || !price) {
    showToast("กรอกข้อมูลให้ครบ", false);
    return;
  }

  try {
    const res = await fetch(apiURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product_name: name, price })
    });

    await res.json();

    loadProducts();
    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
    showToast("เพิ่มสินค้าสำเร็จ");

  } catch (err) {
    console.error(err);
    showToast("เพิ่มสินค้าไม่สำเร็จ", false);
  }
}

// ✅ เปิด modal แก้ไข
function openEdit(id, name, price) {
  document.getElementById("editId").value = id;
  document.getElementById("editName").value = name;
  document.getElementById("editPrice").value = price;

  new bootstrap.Modal(document.getElementById('editModal')).show();
}

// ✅ อัปเดตสินค้า
async function updateProduct() {
  const id = document.getElementById("editId").value;
  const name = document.getElementById("editName").value.trim();
  const price = document.getElementById("editPrice").value;

  if (!name || !price) {
    showToast("กรอกข้อมูลให้ครบ", false);
    return;
  }

  try {
    const res = await fetch(apiURL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, product_name: name, price })
    });

    await res.json();

    loadProducts();
    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    showToast("อัปเดตสำเร็จ");

  } catch (err) {
    console.error(err);
    showToast("อัปเดตไม่สำเร็จ", false);
  }
}

// ✅ ลบสินค้า
async function deleteProduct(id) {
  if (!confirm("ลบสินค้านี้?")) return;

  try {
    const res = await fetch(apiURL, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id })
    });

    await res.json();

    loadProducts();
    showToast("ลบสำเร็จ");

  } catch (err) {
    console.error(err);
    showToast("ลบไม่สำเร็จ", false);
  }
}

loadProducts();
</script>

</body>
</html>
